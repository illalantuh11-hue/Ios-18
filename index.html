<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Duo: iOS 26</title>
<style>
:root {
  --sys-blue: #0A84FF;
  --sys-green: #30D158;
  --sys-indigo: #5E5CE6;
  --sys-orange: #FF9F0A;
  --sys-pink: #FF375F;
  --sys-purple: #BF5AF2;
  --sys-red: #FF453A;
  --sys-teal: #64D2FF;
  --sys-yellow: #FFD60A;
  --sys-gray: #8E8E93;
  --sys-bg: #000000;
  --sys-bg-2: #1C1C1E;
  --sys-text: #FFFFFF;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #E5E5EA;
  font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
}

#stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  perspective: 2500px;
}

#device {
  position: relative;
  width: 894px;
  height: 640px;
  transform-style: preserve-3d;
}

.half {
  position: absolute;
  top: 0;
  width: 447px;
  height: 640px;
}

#left {
  left: 0;
  background: #1C1C1E;
  border-radius: 54px 0 0 54px;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 20px 60px rgba(0,0,0,0.5);
  overflow: hidden;
}

#right {
  left: 447px;
  transform-origin: 0 50%;
  transform-style: preserve-3d;
}

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.front {
  background: #1C1C1E;
  border-radius: 0 54px 54px 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 20px 60px rgba(0,0,0,0.5);
}

.back {
  transform: rotateY(180deg);
  background: #1C1C1E;
  border-radius: 54px;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.12), 0 20px 60px rgba(0,0,0,0.5);
}

#hinge {
  position: absolute;
  left: 442px;
  top: 0;
  width: 10px;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.6), transparent);
  pointer-events: none;
  transform: translateZ(2px);
  opacity: 0;
}

/* ====== ЭКРАНЫ (ВАЖНО: position: relative) ====== */
.screen {
  position: absolute;
  border-radius: 42px;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

#s1 {
  left: 14px;
  top: 15px;
  width: 419px;
  height: 610px;
  position: relative; /* КРИТИЧНО ВАЖНО */
}

#s2 {
  left: 18.5px;
  top: 18.5px;
  width: 857px;
  height: 603px;
  z-index: 5;
  visibility: hidden;
  opacity: 0;
  transform: translateZ(1px);
  position: relative;
}

.wallpaper {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, #5B4BFF 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, #C04CFF 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, #FF6A88 0%, transparent 70%),
    linear-gradient(180deg, #1A1A2E 0%, #0A0A1E 100%);
}

.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  padding: 18px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 15px;
  color: #FFF;
  z-index: 50;
}

.status-bar .icons {
  display: flex;
  gap: 6px;
  align-items: center;
}

.home {
  position: absolute;
  inset: 0;
  z-index: 10;
  padding: 64px 20px 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.icon-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 26px 0;
  justify-items: center;
}

#s2 .icon-grid {
  grid-template-columns: repeat(6, 1fr);
  gap: 30px 0;
}

.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.app:active {
  transform: scale(0.9);
}

.app-icon {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 0 0.5px rgba(255,255,255,0.15);
  overflow: hidden;
}

#s2 .app-icon {
  width: 70px;
  height: 70px;
  border-radius: 16px;
}

.app-icon svg {
  width: 60%;
  height: 60%;
}

.app-name {
  font-size: 11px;
  font-weight: 400;
  color: #FFF;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  white-space: nowrap;
}

.dock {
  margin: 0 -8px 22px;
  padding: 12px;
  border-radius: 32px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.2);
}

.dock .app-name {
  display: none;
}

.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 90px;
  color: #FFF;
}

.lock-date {
  font-size: 19px;
  font-weight: 500;
  opacity: 0.9;
  margin-bottom: 4px;
}

.lock-time {
  font-size: 92px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1;
}

.lock-hint {
  position: absolute;
  bottom: 34px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 14px;
  opacity: 0.8;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  50% { opacity: 0.3; }
}

.app-window {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 40;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #000;
  will-change: transform, filter, border-radius;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.app-window .win-content {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}

.app-window .win-icon {
  width: 100px;
  height: 100px;
}

.app-window .win-name {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  width: 134px;
  height: 5px;
  margin-left: -67px;
  border-radius: 3px;
  background: #FFF;
  z-index: 70;
  box-shadow: 0 0 3px rgba(0,0,0,0.4);
  cursor: pointer;

#controls {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  color: #666;
  font-size: 14px;
  font-weight: 600;

#controls button {
  border: 0;
  border-radius: 14px;
  padding: 8px 16px;
  background: rgba(128,128,128,0.2);

  font: inherit;
  cursor: pointer;
}

#controls input[type="range"] {

#fold-btn {

  background: rgba(128,128,128,0.2);

  font-weight: 600;
  cursor: pointer;
  font-family: inherit;

let SPEED = 0.5;

class Spring {
  constructor() {
    this.x = 0; this.v = 0; this.t = 0;
    this.k = 450; this.z = 0.75;
    this.drag = false; this.e = 0.0008;
  }
  step(dt) {
    if (this.drag) return;
    const S = SPEED;
    const T = dt * S;
    const n = Math.max(1, Math.ceil(T / 0.008));
    const h = T / n;
    const c = 2 * this.z * Math.sqrt(this.k);
    let u = this.v / S;
    for (let i = 0; i < n; i++) {
      u += (this.k * (this.t - this.x) - c * u) * h;
      this.x += u * h;
    }
    this.v = u * S;
  }
  get rest() {
    return !this.drag && Math.abs(this.t - this.x) < this.e && Math.abs(this.v) < this.e * 8;
  }
}

const sty = (el, k, v) => {
  const c = el._c || (el._c = {});
  if (c[k] !== v) { c[k] = v; el.style[k] = v; }
};
